# 푸시할 때마다 테스트를 돌리고, main에 푸시했고 모두 통과하면 서버에 반영해요.
# 흐름: 기능 가지 → dev(테스트만) → main(테스트 + 배포). 자세한 내용은 docs/deploy.md.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # 영상 변환 테스트가 실제 ffmpeg로 돌아요.
      - name: ffmpeg 설치
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # 실행 환경에 Docker가 있어서 Testcontainers(PostgreSQL)가 그대로 돌아요.
      - run: ./gradlew test --no-daemon

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run lint

  deploy:
    needs: [backend-test, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 멈춘 배포가 다음 배포를 오래 막지 않게 해요.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    # 배포는 한 번에 하나씩. 진행 중인 배포는 취소하지 않고 기다려요.
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: ghcr.io/yyy5044/aram-backend:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          tags: ghcr.io/yyy5044/aram-web:${{ github.sha }}
          push: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: SSH 준비
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: 서버에 반영
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
        run: |
          scp -i ~/.ssh/deploy_key deploy/compose.prod.yaml "$DEPLOY_USER@$DEPLOY_HOST:/opt/aram/compose.yaml"
          scp -i ~/.ssh/deploy_key deploy/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:/opt/aram/deploy.sh"
          # 이미지를 받을 일회용 토큰은 표준 입력으로 넘겨요(작업이 끝나면 만료돼요).
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "bash /opt/aram/deploy.sh $TAG $GHCR_USER"
