spring:
  application:
    name: aram-community
  config:
    # 비밀 값(디스코드 키 등)은 git에 올라가지 않는 backend/.env에서 읽어요.
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      # 테이블 구조는 Flyway 마이그레이션(db/migration)으로만 바꾸고, Hibernate는 엔티티와 일치하는지 검증만 해요.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      lifecycle-management: start-only
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  servlet:
    session:
      timeout: 30d
      cookie:
        max-age: 30d

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  scheduling:
    enabled: true
