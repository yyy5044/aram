spring:
  application:
    name: aram-community
  jpa:
    open-in-view: false
    hibernate:
      # 테이블 구조는 Flyway 마이그레이션(db/migration)으로만 바꾸고, Hibernate는 엔티티와 일치하는지 검증만 해요.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  docker:
    compose:
      lifecycle-management: start-only

management:
  endpoints:
    web:
      exposure:
        include: health
