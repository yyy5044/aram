spring:
  application:
    name: aram-community
  config:
    # 비밀 값(디스코드 키 등)은 git에 올라가지 않는 backend/.env에서 읽어요.
    import: optional:file:.env[.properties]
  jpa:
    open-in-view: false
    hibernate:
      # 테이블 구조는 Flyway 마이그레이션(db/migration)으로만 바꾸고, Hibernate는 엔티티와 일치하는지 검증만 해요.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      # 로그인 정보 표는 Flyway(V10)가 만들어요.
      initialize-schema: never
  docker:
    compose:
      lifecycle-management: start-only
  security:
    oauth2:
      client:
        registration:
          discord:
            client-id: ${DISCORD_CLIENT_ID:local-placeholder}
            client-secret: ${DISCORD_CLIENT_SECRET:local-placeholder}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: identify
            client-name: Discord
        provider:
          discord:
            authorization-uri: https://discord.com/oauth2/authorize
            token-uri: https://discord.com/api/oauth2/token
            user-info-uri: https://discord.com/api/users/@me
            user-name-attribute: id
  servlet:
    multipart:
      # 영상 원본 200MB(+여유). 사진 10MB 한도는 ImageService가 따로 검사해요.
      max-file-size: 210MB
      max-request-size: 211MB

server:
  servlet:
    session:
      timeout: 30d
      cookie:
        max-age: 30d

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  scheduling:
    enabled: true
  # 쉼표로 구분한 관리자 디스코드 사용자 ID
  admin-discord-ids: ${APP_ADMIN_DISCORD_IDS:}
  dev-login:
    # 로컬 확인용 로그인. 운영에서는 켜지 않아요.
    enabled: ${APP_DEV_LOGIN_ENABLED:false}
  gamedata:
    ddragon-base-url: https://ddragon.leagueoflegends.com
    cdragon-base-url: https://raw.communitydragon.org
    timeout: 30s
  images:
    # 로컬 개발용 이미지 저장 폴더 (git 제외)
    dir: data/images
  videos:
    # 영상 변환 프로그램. 없으면 영상 올리기만 "변환 프로그램이 없어요"로 끝나요.
    ffmpeg-path: ffmpeg
    ffprobe-path: ffprobe
    # 변환 전 원본을 잠깐 두는 폴더 (git 제외)
    tmp-dir: data/video-tmp
    max-bytes: 209715200
